name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Install pinned native CLIs
        run: npm install --global @anthropic-ai/claude-code@2.1.295 @openai/codex@0.161.0
      - name: Verify CLI versions
        run: |
          claude --version | grep -Fx '2.1.295 (Claude Code)'
          codex --version | grep -Fx 'codex-cli 0.161.0'
      - run: npm test
      - run: npm run check
      - run: sh -n scripts/install-codex.sh
      - run: claude plugin validate .
      - run: git diff --check
