name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Install pinned native CLIs
        run: npm install --global @anthropic-ai/claude-code@2.1.295 @openai/codex@0.161.0
      - name: Verify CLI versions
        run: |
          claude --version | grep -Fx '2.1.295 (Claude Code)'
          codex --version | grep -Fx 'codex-cli 0.161.0'
      - run: npm test
      - run: npm run check
      - run: sh -n scripts/install-codex.sh
      - run: claude plugin validate .
      - run: git diff --check
